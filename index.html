// ---- State snapshot for saved files (replaced by saveAsFile) ----
const SNAPSHOT = null;

// ---- Constants ----
const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const DAY_COLORS = {
  Monday:    '#2563eb',
  Tuesday:   '#7c3aed',
  Wednesday: '#059669',
  Thursday:  '#d97706',
  Friday:    '#dc2626',
  Saturday:  '#0891b2',
  Sunday:    '#db2777'
};
function dayColor(d) { return DAY_COLORS[d] || 'var(--teal-dark)'; }
const TTR = 'Things to Remember';
const ALL_DAYS = [...DAYS, TTR];
const STEP_NAMES = ['Clarity','List','Estimate','Urgent Block','High Block','Capacity','Allocate','Roadmap'];
const KEY = 'clearos_v3';

// ---- State ----
let S = {
  step: 1,
  tasks: [],
  nextId: 1,
  mf: { Monday:0, Tuesday:0, Wednesday:0, Thursday:0, Friday:0, Saturday:0, Sunday:0 },
  completedThisWeek: 0,
  history: [],
  lastSnapshotDate: null,
  skipAllocation: false
};

// ---- UI state (not persisted) ----
let sortDir = 'asc';
let editingId = null;
let notesOpen = new Set();
let advancedInput = false;

// ---- Persistence ----
function save() { localStorage.setItem(KEY, JSON.stringify(S)); }

function initState() {
  if (SNAPSHOT !== null) {
    S = { ...S, ...SNAPSHOT };
  } else {
    const raw = localStorage.getItem(KEY);
    if (raw) try { S = { ...S, ...JSON.parse(raw) }; } catch(e) {}
  }
  if (!S.mf) S.mf = { Monday:0, Tuesday:0, Wednesday:0, Thursday:0, Friday:0, Saturday:0, Sunday:0 };
  if (!S.history) S.history = [];
}

// ---- Save as file ----
async function saveAsFile() {
  const html = document.documentElement.outerHTML;
  const state = JSON.stringify(S);
  const modified = html.replace('const SNAPSHOT = null;', `const SNAPSHOT = ${state};`);
  const today = new Date().toISOString().split('T')[0];
  const filename = `CLEAROS-${today}.html`;
  const blob = new Blob([modified], { type: 'text/html' });

  if ('showSaveFilePicker' in window) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: filename,
        types: [{ description: 'CLEAR OS Plan', accept: { 'text/html': ['.html'] } }]
      });
      const writable = await handle.createWritable();
      await writable.write(blob);
      await writable.close();
      return;
    } catch(e) {
      if (e.name === 'AbortError') return;
      // fall through to download fallback
    }
  }

  // Fallback — saves to Downloads
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

// ---- Auto-snapshot: captures last week's data at the start of a new week ----
function maybeAutoSnapshot() {
  const today = new Date().toISOString().split('T')[0];
  if (S.lastSnapshotDate === today) return;
  const carry = S.tasks.filter(t => t.priority !== null && !t.wse);
  if (!carry.length) return;

  S.history.push({
    weekEnded: today,
    totalTasks: S.tasks.filter(t => !t.wse).length + S.completedThisWeek,
    completedTasks: S.completedThisWeek,
    carryOverTasks: carry.length,
    carryOverMins: carry.reduce((s,t) => s + (t.minutes||0), 0),
    urgentRemaining: S.tasks.filter(t => t.priority === 'Urgent' && !t.wse).length,
    planned: committedMins(),
    capacity: totalCapacity()
  });

  S.lastSnapshotDate = today;
  S.completedThisWeek = 0;
  save();
}

// ---- Import saved plan file ----
function importFile() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.html';
  input.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const text = await file.text();
    const marker = 'const SNAPSHOT = ';
    const idx = text.indexOf(marker);
    if (idx < 0) { alert('No plan data found in this file. Make sure you\'re opening a saved CLEAROS file.'); return; }
    const jsonStart = idx + marker.length;
    const jsonEnd = text.indexOf(';\n', jsonStart);
    if (jsonEnd < 0) { alert('Could not read this file. It may be corrupted.'); return; }
    const jsonStr = text.slice(jsonStart, jsonEnd);
    if (jsonStr === 'null') { alert('This file has no saved plan. Use Save as file from the Roadmap step to create a plan file.'); return; }
    try {
      const loaded = JSON.parse(jsonStr);
      S = { ...S, ...loaded };
      save(); render();
    } catch(err) {
      alert('Could not read the plan file. It may be corrupted.');
    }
  };
  input.click();
}


// ---- Drag-to-reorder ----
function reorderTasks(orderedIds) {
  const idSet = new Set(orderedIds);
  const byId = Object.fromEntries(S.tasks.map(t => [t.id, t]));
  const positions = [];
  S.tasks.forEach((t, i) => { if (idSet.has(t.id)) positions.push(i); });
  positions.forEach((pos, i) => { S.tasks[pos] = byId[orderedIds[i]]; });
  save();
}

function initSortables() {
  if (typeof Sortable === 'undefined') return;
  const makeSort = id => {
    const el = document.getElementById(id);
    if (!el) return;
    new Sortable(el, {
      handle: '.drag-handle',
      animation: 150,
      ghostClass: 'drag-ghost',
      onEnd() {
        const ids = [...el.querySelectorAll('[data-id]')].map(n => parseInt(n.dataset.id));
        reorderTasks(ids);
      }
    });
  };
  if (S.step === 2) makeSort('taskList');
  if (S.step === 4) makeSort('urgentList');
  if (S.step === 5) makeSort('highList');
  if (S.step === 7 && S.skipAllocation) { makeSort('allocUrgent'); makeSort('allocHigh'); }
  if (S.step === 7 && !S.skipAllocation) {
    ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday','Things_to_Remember'].forEach(d => makeSort('dayTasks-' + d));
  }
  if (S.step === 8 && S.skipAllocation) { makeSort('priUrgent'); makeSort('priHigh'); }
  if (S.step === 8 && !S.skipAllocation) {
    ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday','Things_to_Remember'].forEach(d => makeSort('dayTasks-' + d));
  }
}

// ---- Skip allocation ----
function skipAlloc() {
  S.skipAllocation = true;
  S.tasks.forEach(t => { t.dayBlock = null; });
  save(); go(8);
}

function unskipAlloc() {
  S.skipAllocation = false;
  save(); rerender();
}

// ---- Navigation ----
function go(n) { if (n < 1 || n > 8) return; S.step = n; save(); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
function next() { go(S.step + 1); }
function prev() { go(S.step - 1); }

// ---- Helpers ----
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtMins(m) {
  if (!m) return '';
  if (m < 60) return m + ' min';
  const h = Math.floor(m / 60), r = m % 60;
  return h + 'h' + (r ? ' ' + r + 'm' : '');
}
function totalPlanned() { return S.tasks.reduce((s,t) => s + (t.minutes||0), 0); }
function totalCapacity() { return DAYS.reduce((s,d) => s + Math.floor((S.mf[d]||0) / 2), 0); }
function committedMins() {
  return S.tasks
    .filter(t => (t.priority === 'Urgent' || t.priority === 'High') && !t.wse)
    .reduce((s,t) => s + (t.minutes||0), 0);
}
function dayUsed(day) {
  return S.tasks.filter(t => t.dayBlock === day && t.priority !== 'Parked' && !t.wse)
    .reduce((s,t) => s + (t.minutes||0), 0);
}
function dayCapacity(day) { return Math.floor((S.mf[day]||0) / 2); }

// ---- Render ----
function render() {
  renderSteps();
  const fns = [null, renderP1, renderP2, renderP3, renderP4, renderP5, renderP6, renderP7, renderP8];
  document.getElementById('main').innerHTML = fns[S.step]();
  afterRender(true);
}

function renderSteps() {
  const n = 8;
  let h = '';
  for (let i = 1; i <= n; i++) {
    const done = i < S.step, active = i === S.step;
    const cls = done ? 'step-btn done' : active ? 'step-btn active' : 'step-btn';
    h += `<button class="${cls}" onclick="go(${i})">
      <div class="step-num">${done ? '✓' : i}</div>
      <span>${STEP_NAMES[i-1]}</span>
    </button>`;
    if (i < n) h += '<div class="step-divider"></div>';
  }
  document.getElementById('steps').innerHTML = h;
  const ind = document.getElementById('step-indicator');
  if (ind) ind.textContent = `Step ${S.step} of ${n}: ${STEP_NAMES[S.step - 1]}`;
}

function afterRender(fullRender) {
  if (fullRender && S.step === 2) document.getElementById('addInput')?.focus();
  initSortables();
}

function rerender() {
  const fns = [null, renderP1, renderP2, renderP3, renderP4, renderP5, renderP6, renderP7, renderP8];
  document.getElementById('main').innerHTML = fns[S.step]();
  afterRender(false);
}

// ============================================================
// P1 — Clarity
// ============================================================
function renderP1() {
  maybeAutoSnapshot();
  const carryover = S.tasks.filter(t => (t.priority === 'Urgent' || t.priority === 'High') && !t.wse);
  const waiting   = S.tasks.filter(t => t.wse);

  if (!carryover.length && !waiting.length) {
    const hasHistory = S.history.length > 0;
    return `
      <div class="panel-title">Clarity</div>
      <div class="panel-hint">Before you plan, know where you stand.</div>
      <div class="card">
        <div class="fresh-state">
          <div class="fresh-icon">✦</div>
          <h3>You're starting fresh</h3>
          <p>No tasks carried over from last week. Head to List to begin.</p>
          ${!hasHistory ? `<div style="margin-top:20px;border-top:1px solid var(--grey-border);padding-top:16px">
            <button class="btn btn-secondary" onclick="importFile()">Load previous plan</button>
            <div style="font-size:12px;color:var(--grey-mid);margin-top:8px">Have a saved CLEAROS file from another device? Load it to pick up where you left off.</div>
          </div>` : ''}
        </div>
      </div>
      <div class="step-nav">
        <div></div>
        <button class="btn btn-primary" onclick="next()">Next: List →</button>
      </div>`;
  }

  let h = '';

  if (carryover.length) {
    h += `<div class="card"><div class="card-title">Carried over from last week</div>`;
    carryover.forEach(t => {
      h += `<div class="clarity-row">
        <div class="clarity-row-body">
          <div class="clarity-row-name">${esc(t.task)}</div>
          <div class="clarity-row-meta">
            ${t.priority ? `<span class="badge badge-${t.priority.toLowerCase()}">${t.priority}</span>` : ''}
            ${t.dayBlock ? `<span class="badge badge-day">${t.dayBlock}</span>` : ''}
            ${t.minutes ? `<span class="badge badge-mins">${fmtMins(t.minutes)}</span>` : ''}
          </div>
        </div>
        <div class="clarity-actions">
          <button class="ibtn i-done" onclick="clarityDone(${t.id})">✓ Done</button>
          <button class="ibtn i-carry" onclick="clarityCarryForward(${t.id})">↻ Carry Forward</button>
        </div>
      </div>`;
    });
    h += `</div>`;
  }

  if (waiting.length) {
    h += `<div class="card"><div class="card-title">With someone else</div>`;
    waiting.forEach(t => {
      h += `<div class="clarity-row">
        <div class="clarity-row-body">
          <div class="clarity-row-name">${esc(t.task)}</div>
          <div class="clarity-row-meta">
            ${t.minutes ? `<span class="badge badge-mins">${fmtMins(t.minutes)}</span>` : ''}
            ${t.notes ? `<span style="font-size:12px;color:var(--grey-mid);font-style:italic">${esc(t.notes)}</span>` : ''}
          </div>
        </div>
        <div class="clarity-actions">
          <button class="ibtn i-done" onclick="clarityDone(${t.id})">✓ Done</button>
          <button class="ibtn i-todo" onclick="clarityMoveToTodo(${t.id})">→ Move to To Do</button>
        </div>
      </div>`;
    });
    h += `</div>`;
  }

  return `
    <div class="panel-title">Clarity</div>
    <div class="panel-hint">Before you plan, know where you stand.</div>
    ${h}
    <div class="step-nav">
      <div></div>
      <button class="btn btn-primary" onclick="next()">Next: List →</button>
    </div>`;
}

function clarityDone(id) { S.tasks = S.tasks.filter(t => t.id !== id); save(); rerender(); }
function clarityCarryForward(id) {
  const t = S.tasks.find(t => t.id === id);
  if (t) { t.priority = null; t.dayBlock = null; t.wse = false; t.carriedOver = false; }
  save(); rerender();
}
function clarityMoveToTodo(id) {
  const t = S.tasks.find(t => t.id === id);
  if (t) { t.wse = false; t.carriedOver = false; t.priority = null; t.dayBlock = null; }
  save(); rerender();
}

// ============================================================
// P2 — List
// ============================================================
function renderP2() {
  const tasks = S.tasks.filter(t => !t.wse);

  const rows = tasks.length === 0
    ? `<div style="text-align:center;padding:36px 20px;color:var(--grey-mid);font-size:14px;font-style:italic">Nothing here yet. Type above to add your first task.</div>`
    : tasks.map(t => {
        if (editingId === t.id) {
          return `<div class="task-row">
            <input class="edit-input" id="edit-${t.id}" value="${esc(t.task)}"
              onkeydown="editKey(event,${t.id})" />
            <div class="task-actions">
              <button class="btn btn-sm btn-primary" onclick="saveEdit(${t.id})">Save</button>
              <button class="btn btn-sm btn-secondary" onclick="cancelEdit()">Cancel</button>
            </div>
          </div>`;
        }
        const notesBlock = notesOpen.has(t.id) ? `
          <div style="padding:0 16px 10px">
            <textarea class="notes-area" placeholder="Add a note…"
              onchange="saveNotes(${t.id},this.value)">${esc(t.notes||'')}</textarea>
          </div>` : '';
        const dragHandle = `<span class="drag-handle" title="Drag to reorder"><svg width="10" height="14" viewBox="0 0 10 14" fill="none"><circle cx="3" cy="2.5" r="1.5" fill="currentColor"/><circle cx="7" cy="2.5" r="1.5" fill="currentColor"/><circle cx="3" cy="7" r="1.5" fill="currentColor"/><circle cx="7" cy="7" r="1.5" fill="currentColor"/><circle cx="3" cy="11.5" r="1.5" fill="currentColor"/><circle cx="7" cy="11.5" r="1.5" fill="currentColor"/></svg></span>`;
        const actions = `<div class="task-actions">
              <button class="btn btn-sm btn-secondary" onclick="toggleNotes(${t.id})" title="Notes">${notesOpen.has(t.id)?'▲':'📝'}</button>
              <button class="btn btn-sm btn-secondary" onclick="startEdit(${t.id})">Edit</button>
              <button class="btn btn-sm btn-danger" onclick="delTask(${t.id})">✕</button>
            </div>`;
        if (advancedInput) {
          return `<div data-id="${t.id}">
            <div class="task-row">
              ${dragHandle}
              <div class="task-text" style="flex:1 1 0;min-width:0">${esc(t.task)}</div>
              <select class="row-adv-select" onchange="setTaskField(${t.id},'priority',this.value)">
                <option value="" ${!t.priority?'selected':''}>Priority</option>
                <option value="Urgent" ${t.priority==='Urgent'?'selected':''}>🔴 Urgent</option>
                <option value="High" ${t.priority==='High'?'selected':''}>🟠 High</option>
              </select>
              <input class="row-adv-mins" type="number" inputmode="numeric" min="0" step="5" placeholder="mins"
                value="${t.minutes||''}" onchange="setTaskField(${t.id},'minutes',parseInt(this.value)||null)" />
              ${actions}
            </div>${notesBlock}
          </div>`;
        }
        return `<div data-id="${t.id}">
          <div class="task-row">
            ${dragHandle}
            <div class="task-text">${esc(t.task)}</div>
            ${actions}
          </div>${notesBlock}
        </div>`;
      }).join('');

  const sortLbl = sortDir === 'asc' ? 'A→Z' : 'Z→A';

  const advHtml = advancedInput ? `
      <select class="adv-select" id="advPriority">
        <option value="">Priority</option>
        <option value="Urgent">🔴 Urgent</option>
        <option value="High">🟠 High</option>
      </select>
      <input class="adv-mins-input" id="advMins" type="number" inputmode="numeric" min="0" step="5" placeholder="mins" />` : '';

  return `
    <div class="panel-title">List</div>
    <div class="panel-hint">Get everything out of your head. Press Enter to add, or paste multiple lines at once.</div>
    <div class="card">
      <div class="add-row${advancedInput ? ' add-row-adv' : ''}">
        <input class="add-input" id="addInput" type="text"
          placeholder="${advancedInput ? 'Task name' : 'Add a task (press Enter, or paste a list)'}"
          onkeydown="addKey(event)" onpaste="pasteHandler(event)" />
        ${advHtml}
        <button class="btn btn-primary" onclick="addFromInput()">Add</button>
        <button class="btn btn-sm btn-secondary" onclick="toggleAdvanced()" title="${advancedInput ? 'Back to simple input' : 'Add priority and time estimate while capturing'}">${advancedInput ? 'Simple' : 'Advanced'}</button>
        ${tasks.length > 1 ? `<button class="btn btn-sm btn-secondary" onclick="toggleSort()">${sortLbl}</button>` : ''}
      </div>
      <div id="taskList">${rows}</div>
      ${tasks.length > 0 ? `<div class="totals-row"><span><strong>${tasks.length}</strong> task${tasks.length!==1?'s':''}</span></div>` : ''}
    </div>
    <div class="step-nav">
      <button class="btn btn-ghost" onclick="prev()">← Clarity</button>
      <button class="btn btn-primary" onclick="next()">Next: Estimate →</button>
    </div>`;
}

function addKey(e) { if (e.key === 'Enter') addFromInput(); }

function pasteHandler(e) {
  const text = e.clipboardData.getData('text');
  if (!text.includes('\n')) return;
  e.preventDefault();
  text.split(/\r?\n/).map(l => l.trim()).filter(Boolean).forEach(addTask);
  save(); rerender();
  document.getElementById('addInput')?.focus();
}

function addFromInput() {
  const el = document.getElementById('addInput');
  if (!el) return;
  const val = el.value.trim();
  if (!val) return;
  if (advancedInput) {
    const priority = document.getElementById('advPriority')?.value || null;
    const mins = parseInt(document.getElementById('advMins')?.value) || null;
    val.split(/\r?\n/).map(l => l.trim()).filter(Boolean).forEach(t => addTask(t, priority, mins));
    const p = document.getElementById('advPriority'); if (p) p.value = '';
    const m = document.getElementById('advMins'); if (m) m.value = '';
  } else {
    val.split(/\r?\n/).map(l => l.trim()).filter(Boolean).forEach(t => addTask(t));
  }
  el.value = ''; save(); rerender();
  document.getElementById('addInput')?.focus();
}

function toggleAdvanced() { advancedInput = !advancedInput; rerender(); }
function setTaskField(id, field, value) {
  const t = S.tasks.find(t => t.id === id);
  if (t) { t[field] = value || null; save(); }
}

function addTask(text, priority = null, minutes = null) {
  S.tasks.push({ id: S.nextId++, task: text, notes: '', minutes: minutes, priority: priority, dayBlock: null, wse: false, carriedOver: false });
}

function delTask(id) { S.tasks = S.tasks.filter(t => t.id !== id); notesOpen.delete(id); save(); rerender(); }

function startEdit(id) { editingId = id; rerender(); document.getElementById('edit-' + id)?.focus(); }
function saveEdit(id) {
  const el = document.getElementById('edit-' + id);
  const t = S.tasks.find(t => t.id === id);
  if (t && el) t.task = el.value.trim() || t.task;
  editingId = null; save(); rerender();
}
function cancelEdit() { editingId = null; rerender(); }
function editKey(e, id) { if (e.key === 'Enter') saveEdit(id); if (e.key === 'Escape') cancelEdit(); }

function toggleNotes(id) {
  notesOpen.has(id) ? notesOpen.delete(id) : notesOpen.add(id);
  rerender();
}
function saveNotes(id, v) { const t = S.tasks.find(t => t.id === id); if (t) { t.notes = v; save(); } }

function toggleSort() {
  sortDir = sortDir === 'asc' ? 'desc' : 'asc';
  S.tasks.sort((a,b) => sortDir === 'asc' ? a.task.localeCompare(b.task) : b.task.localeCompare(a.task));
  save(); rerender();
}

// ============================================================
// P3 — Estimate
// ============================================================
function renderP3() {
  const tasks = S.tasks.filter(t => !t.wse);

  if (!tasks.length) return `
    <div class="panel-title">Estimate</div>
    <div class="panel-hint">No tasks to estimate yet.</div>
    <div class="step-nav">
      <button class="btn btn-ghost" onclick="prev()">← List</button>
      <button class="btn btn-primary" onclick="next()">Next: Urgent Block →</button>
    </div>`;

  const rows = tasks.map((t, i) => `
    <div class="est-row">
      <span class="est-task">${esc(t.task)}</span>
      <input class="est-input" type="number" min="0" step="5" tabindex="${i+1}"
        placeholder="0" inputmode="numeric" value="${t.minutes||''}" id="est_${t.id}"
        onchange="setMinutes(${t.id},this.value)" />
      <span class="est-unit">min</span>
    </div>`).join('');

  const total = totalPlanned();
  const noEst = tasks.filter(t => !t.minutes).length;

  return `
    <div class="panel-title">Estimate</div>
    <div class="panel-hint">How long will each task actually take? Tab between fields. Skip if you genuinely cannot estimate.</div>
    <div class="card">
      <div class="card-title" style="display:flex;justify-content:space-between">
        <span>${tasks.length} tasks</span>
        <span style="font-weight:400;text-transform:none;letter-spacing:0;font-size:12px;color:var(--grey-mid)">Tab to move between fields</span>
      </div>
      ${rows}
      <div class="totals-row" id="estTotals">
        <span>Total: <strong>${fmtMins(total)||'0 min'}</strong></span>
        ${noEst > 0 ? `<span>${noEst} without estimate</span>` : `<span style="color:var(--teal-dark)">All tasks estimated ✓</span>`}
      </div>
    </div>
    <div class="step-nav">
      <button class="btn btn-ghost" onclick="prev()">← List</button>
      <button class="btn btn-primary" onclick="next()">Next: Urgent Block →</button>
    </div>`;
}

function setMinutes(id, v) {
  const t = S.tasks.find(t => t.id === id);
  if (t) { t.minutes = parseInt(v) || null; save(); }
  const total = totalPlanned();
  const noEst = S.tasks.filter(t => !t.wse && !t.minutes).length;
  const el = document.getElementById('estTotals');
  if (el) el.innerHTML = `<span>Total: <strong>${fmtMins(total)||'0 min'}</strong></span>${noEst>0?`<span>${noEst} without estimate</span>`:`<span style="color:var(--teal-dark)">All tasks estimated ✓</span>`}`;
}

// ============================================================
// P4 — Urgent Block
// ============================================================
function renderP4() {
  const tasks = S.tasks.filter(t => !t.wse);
  const urgentCount = tasks.filter(t => t.priority === 'Urgent').length;

  const rows = tasks.map(t => {
    const on = t.priority === 'Urgent';
    return `<div class="pri-row ${on ? 'is-urgent' : ''}" data-id="${t.id}">
      <span class="drag-handle" title="Drag to reorder"><svg width="10" height="14" viewBox="0 0 10 14" fill="none"><circle cx="3" cy="2.5" r="1.5" fill="currentColor"/><circle cx="7" cy="2.5" r="1.5" fill="currentColor"/><circle cx="3" cy="7" r="1.5" fill="currentColor"/><circle cx="7" cy="7" r="1.5" fill="currentColor"/><circle cx="3" cy="11.5" r="1.5" fill="currentColor"/><circle cx="7" cy="11.5" r="1.5" fill="currentColor"/></svg></span>
      <div class="pri-row-text">${esc(t.task)}</div>
      ${t.minutes ? `<span class="pri-row-mins">${t.minutes}m</span>` : ''}
      <button class="btn-mark-urgent ${on ? 'on' : ''}" onclick="toggleUrgent(${t.id})">
        ${on ? '🔴 Urgent' : 'Mark Urgent'}
      </button>
    </div>`;
  }).join('');

  const lastWeekU = S.history.length > 0 ? S.history[S.history.length - 1] : null;
  const urgentInsight = lastWeekU && lastWeekU.urgentRemaining > 0
    ? `<div class="obs-box" style="margin-bottom:16px">Last week <strong>${lastWeekU.urgentRemaining}</strong> urgent task${lastWeekU.urgentRemaining !== 1 ? 's' : ''} carried over. Check whether any appear again before adding new ones.</div>`
    : '';

  return `
    <div class="panel-title">Urgent Block</div>
    <div class="panel-hint">From your task list, mark what MUST happen before next week.</div>
    ${urgentInsight}
    <div class="warn-banner warn-urgent">
      <div class="warn-icon">⚠️</div>
      <div>
        <div class="warn-title">What is URGENT?</div>
        <div class="warn-text">Urgent means this task <strong>has to be done</strong> before your next planning session. Not "important". Not "I'd like to". It has to happen. If more than a handful of tasks feel urgent, most of them aren't.</div>
      </div>
    </div>
    <div class="card" id="urgentList">
      ${rows || '<div style="text-align:center;padding:32px;color:var(--grey-mid);font-style:italic">No tasks to prioritise.</div>'}
      ${urgentCount > 0 ? `<div class="totals-row"><span><strong>${urgentCount}</strong> task${urgentCount!==1?'s':''} marked urgent</span></div>` : ''}
      ${urgentCount > 3 ? `<div class="urgency-friction">You have <strong>${urgentCount} urgent tasks.</strong> In this run through, urgent means it <strong>has to be done by this time next week. Or you're in trouble.</strong> The next pass (High) is the things you want to get done if capacity allows.</div>` : ''}
    </div>
    <div class="step-nav">
      <button class="btn btn-ghost" onclick="prev()">← Estimate</button>
      <button class="btn btn-primary" onclick="next()">Next: High Block →</button>
    </div>`;
}

function toggleUrgent(id) {
  const t = S.tasks.find(t => t.id === id);
  if (t) t.priority = (t.priority === 'Urgent') ? null : 'Urgent';
  save(); rerender();
}

// ============================================================
// P5 — High Block
// ============================================================
function renderP5() {
  const tasks = S.tasks.filter(t => !t.wse && t.priority !== 'Urgent');
  const highCount = tasks.filter(t => t.priority === 'High').length;

  const rows = tasks.map(t => {
    const on = t.priority === 'High';
    return `<div class="pri-row ${on ? 'is-high' : ''}" data-id="${t.id}">
      <span class="drag-handle" title="Drag to reorder"><svg width="10" height="14" viewBox="0 0 10 14" fill="none"><circle cx="3" cy="2.5" r="1.5" fill="currentColor"/><circle cx="7" cy="2.5" r="1.5" fill="currentColor"/><circle cx="3" cy="7" r="1.5" fill="currentColor"/><circle cx="7" cy="7" r="1.5" fill="currentColor"/><circle cx="3" cy="11.5" r="1.5" fill="currentColor"/><circle cx="7" cy="11.5" r="1.5" fill="currentColor"/></svg></span>
      <div class="pri-row-text">${esc(t.task)}</div>
      ${t.minutes ? `<span class="pri-row-mins">${t.minutes}m</span>` : ''}
      <button class="btn-mark-high ${on ? 'on' : ''}" onclick="toggleHigh(${t.id})">
        ${on ? '🟠 High' : 'Mark High'}
      </button>
    </div>`;
  }).join('');

  const urgentCount = S.tasks.filter(t => t.priority === 'Urgent').length;

  return `
    <div class="panel-title">High Block</div>
    <div class="panel-hint">From the remaining tasks, mark what you'd like to get done this week.</div>
    <div class="warn-banner warn-high">
      <div class="warn-icon">💡</div>
      <div>
        <div class="warn-title">What is HIGH priority?</div>
        <div class="warn-text">High means you would <strong>like</strong> to get this done this week if capacity allows. Be realistic. How many can you genuinely complete alongside your ${urgentCount} urgent task${urgentCount!==1?'s':''}? Everything not marked High or Urgent will be set to Parked.</div>
      </div>
    </div>
    <div class="card" id="highList">
      ${tasks.length === 0
        ? `<div style="text-align:center;padding:32px;color:var(--grey-mid);font-style:italic">All tasks are already marked urgent.</div>`
        : rows}
      ${highCount > 0 ? `<div class="totals-row"><span><strong>${highCount}</strong> task${highCount!==1?'s':''} marked high</span></div>` : ''}
    </div>
    <div class="step-nav">
      <button class="btn btn-ghost" onclick="prev()">← Urgent Block</button>
      <button class="btn btn-primary" onclick="applyDefaultsAndNext()">Next: Allocate →</button>
    </div>`;
}

function toggleHigh(id) {
  const t = S.tasks.find(t => t.id === id);
  if (t) t.priority = (t.priority === 'High') ? null : 'High';
  save(); rerender();
}

function applyDefaultsAndNext() {
  S.tasks.forEach(t => { if (!t.priority) t.priority = 'Parked'; });
  save(); go(6);
}

// ============================================================
// P6 — Capacity
// ============================================================
function renderP6() {
  const cap = totalCapacity();
  const committed = committedMins();
  const ratio = cap > 0 && committed > 0 ? committed / cap : 0;
  const delta = committed - cap;
  let ratioClass = 'ok', obsClass = '';
  if (ratio > 1.8) { ratioClass = 'over'; obsClass = 'over'; }
  else if (ratio > 1.1) { ratioClass = 'warn'; obsClass = 'warn'; }

  const urgHighTasks = S.tasks.filter(t => !t.wse && (t.priority === 'Urgent' || t.priority === 'High'));
  const unestimated = urgHighTasks.filter(t => !t.minutes).length;
  const unestimatedHtml = unestimated > 0
    ? `<div class="delta-callout"><strong>${unestimated} urgent/high task${unestimated !== 1 ? 's have' : ' has'} no time estimate.</strong> Your actual commitment may be higher than shown.</div>`
    : '';

  const lastWeekA = S.history.length > 0 ? S.history[S.history.length - 1] : null;
  const lastWeekRatio = lastWeekA && lastWeekA.capacity > 0 ? lastWeekA.planned / lastWeekA.capacity : 0;
  const historyNote = lastWeekA && lastWeekA.capacity > 0
    ? ` Last week your plan was <strong>${lastWeekRatio.toFixed(1)}x</strong> your capacity${lastWeekA.carryOverTasks > 0 ? `, with ${lastWeekA.carryOverTasks} task${lastWeekA.carryOverTasks !== 1 ? 's' : ''} carried over` : ''}.`
    : '';

  let decisionHtml = '';
  if (cap > 0) {
    let decCls, decMsg, decAction = '';
    if (committed === 0) {
      decCls = 'cap-decision cap-neutral';
      decMsg = 'Add time estimates to your tasks in the Estimate step to see whether your plan is realistic.';
    } else if (ratio < 0.9) {
      decCls = 'cap-decision cap-good';
      decMsg = `Your plan looks achievable. You have committed ${fmtMins(committed)} across ${fmtMins(cap)} of available time. Head to Allocate and plan your days.`;
    } else if (ratio < 1.1) {
      decCls = 'cap-decision cap-warn';
      decMsg = `Your plan is tight. You have committed ${fmtMins(committed)} against ${fmtMins(cap)} available. There is little room if the unexpected arrives.`;
    } else if (ratio < 1.5) {
      decCls = 'cap-decision cap-over';
      decMsg = `You are over-committed: ${fmtMins(committed)} planned against ${fmtMins(cap)} available. Consider going back to move some High tasks to Parked, or add more available hours above.`;
      decAction = `<div style="margin-top:10px"><button class="btn btn-secondary btn-sm" onclick="go(5)">Adjust priorities</button></div>`;
    } else {
      decCls = 'cap-decision cap-over';
      decMsg = `Your commitments are ${ratio.toFixed(1)}x your available capacity. This plan will not hold. Go back and take tasks out of this week, or this week will not be executable.`;
      decAction = `<div style="margin-top:10px"><button class="btn btn-secondary btn-sm" onclick="go(5)">Adjust priorities</button></div>`;
    }
    decisionHtml = `<div class="${decCls}">${decMsg}${decAction}</div>`;
  }

  const revealHtml = cap > 0 ? `
    ${unestimatedHtml}
    <div class="reality-strip">
      <div class="reality-card">
        <div class="reality-lbl">Urgent + High Work</div>
        <div class="reality-val">${committed}<span style="font-size:13px;font-weight:400;color:var(--grey-mid)"> min</span></div>
        <div class="reality-sub">${fmtMins(committed) || 'no estimates yet'}</div>
      </div>
      <div class="reality-card">
        <div class="reality-lbl">Available Capacity</div>
        <div class="reality-val ok">${cap}<span style="font-size:13px;font-weight:400;color:var(--grey-mid)"> min</span></div>
        <div class="reality-sub">${fmtMins(cap) || '-'} usable this week</div>
      </div>
      <div class="reality-card">
        <div class="reality-lbl">${delta >= 0 ? 'Overcommitted' : 'Capacity Remaining'}</div>
        <div class="reality-val ${delta > 0 ? 'over' : 'ok'}">${Math.abs(delta)}<span style="font-size:13px;font-weight:400;color:var(--grey-mid)"> min</span></div>
        <div class="reality-sub">${fmtMins(Math.abs(delta)) || '-'}</div>
      </div>
      <div class="reality-card">
        <div class="reality-lbl">Commitment Ratio</div>
        <div class="reality-val ${ratioClass}">${committed > 0 ? ratio.toFixed(2) : '-'}<span style="font-size:13px;font-weight:400;color:var(--grey-mid)">${committed > 0 ? 'x' : ''}</span></div>
        <div class="reality-sub">${ratio > 0 ? (ratio >= 1 ? Math.round((ratio-1)*100)+'% over capacity' : Math.round((1-ratio)*100)+'% under capacity') : 'no estimates yet'}</div>
      </div>
    </div>
    ${decisionHtml}
    <div class="obs-box ${obsClass}">${getRoadmapObs(ratio, cap, committed, urgHighTasks.length)}${historyNote}</div>`
    : `<div class="cap-placeholder">Enter your available hours above and your capacity check will appear here.</div>`;

  const hrsCells = DAYS.map(d => {
    const hrs = S.mf[d] ? (S.mf[d] / 60) : '';
    return `<div class="mf-cell">
      <div class="mf-day-lbl">${d.slice(0,3)}</div>
      <input class="mf-input" type="number" min="0" max="16" step="0.5" placeholder="0"
        value="${hrs}" inputmode="decimal" onchange="setHours('${d}',this.value)" />
    </div>`;
  }).join('');

  return `
    <div class="panel-title">Capacity</div>
    <div class="panel-hint">How many hours do you have available for focused work each day this week?</div>
    <div style="margin-bottom:16px;text-align:right">
      <button class="btn btn-secondary btn-sm" onclick="go(7)">Skip: go straight to Allocate</button>
    </div>
    <div class="card" style="margin-bottom:20px">
      <div class="card-title" style="display:flex;justify-content:space-between;align-items:center;gap:12px">
        <span>Hours available per day</span>
        <span style="font-size:11px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--grey-mid);white-space:nowrap">We use half as your realistic working time</span>
      </div>
      <div style="padding:14px 16px 16px"><div class="mf-grid">${hrsCells}</div></div>
    </div>
    ${revealHtml}
    <div class="step-nav">
      <button class="btn btn-ghost" onclick="prev()">← High Block</button>
      <button class="btn btn-primary" onclick="go(7)">Plan my days →</button>
    </div>`;
}

// ============================================================
// P7 — Allocate
// ============================================================
function renderP7() {
  const tasks = S.tasks.filter(t => !t.wse);

  const groups = [
    { label: 'Urgent', cls: 'badge-urgent', items: tasks.filter(t => t.priority === 'Urgent') },
    { label: 'High', cls: 'badge-high', items: tasks.filter(t => t.priority === 'High') },
    { label: 'Parked', cls: 'badge-parked', items: tasks.filter(t => t.priority === 'Parked') }
  ].filter(g => g.items.length > 0);

  function mkDayOpts(t) {
    let opts = `<option value="" ${!t.dayBlock?'selected':''}>Day...</option>`;
    ALL_DAYS.forEach(d => {
      const label = d === TTR ? 'Things to Remember' : d;
      opts += `<option value="${d}" ${t.dayBlock===d?'selected':''}>${label}</option>`;
    });
    return opts;
  }

  let rows = '';
  groups.forEach(g => {
    const gid = g.label === 'Urgent' ? 'allocUrgent' : g.label === 'High' ? 'allocHigh' : 'allocParked';
    if (g.label === 'Parked') {
      rows += `<details class="alloc-parked"><summary class="alloc-parked-summary"><span>Parked: Not This Week <span style="font-weight:400;opacity:.6">(${g.items.length})</span></span><span class="pool-chevron">▾</span></summary><div id="${gid}">`;
    } else {
      rows += `<div class="card-title" style="background:var(--grey-light)">${g.label} <span style="font-weight:400;opacity:.6">(${g.items.length})</span></div><div id="${gid}">`;
    }
    g.items.forEach(t => {
      const needsDay = t.priority !== 'Parked';
      rows += `<div class="alloc-row" data-id="${t.id}">
        <span class="drag-handle" title="Drag to reorder"><svg width="10" height="14" viewBox="0 0 10 14" fill="none"><circle cx="3" cy="2.5" r="1.5" fill="currentColor"/><circle cx="7" cy="2.5" r="1.5" fill="currentColor"/><circle cx="3" cy="7" r="1.5" fill="currentColor"/><circle cx="7" cy="7" r="1.5" fill="currentColor"/><circle cx="3" cy="11.5" r="1.5" fill="currentColor"/><circle cx="7" cy="11.5" r="1.5" fill="currentColor"/></svg></span>
        <div class="alloc-task" title="${esc(t.task)}">${esc(t.task)}</div>
        ${t.minutes ? `<span class="alloc-mins">${t.minutes}m</span>` : ''}
        ${needsDay
          ? (() => { const dc = t.dayBlock && DAY_COLORS[t.dayBlock] ? `color:${DAY_COLORS[t.dayBlock]};border-color:${DAY_COLORS[t.dayBlock]};font-weight:600` : ''; return `<select class="day-select" style="${dc}" onchange="setDay(${t.id},this.value)">${mkDayOpts(t)}</select>`; })()
          : `<span style="font-size:12px;color:var(--grey-mid)">Things to Remember</span>`}
      </div>`;
    });
    rows += g.label === 'Parked' ? '</div></details>' : '</div>';
  });

  // Skip mode: priority list with drag handles
  if (S.skipAllocation) {
    const urgItems = S.tasks.filter(t => !t.wse && t.priority === 'Urgent');
    const highItems = S.tasks.filter(t => !t.wse && t.priority === 'High');
    const mkSkipRow = t => `<div class="alloc-row" data-id="${t.id}">
      <span class="drag-handle" title="Drag to reorder"><svg width="10" height="14" viewBox="0 0 10 14" fill="none"><circle cx="3" cy="2.5" r="1.5" fill="currentColor"/><circle cx="7" cy="2.5" r="1.5" fill="currentColor"/><circle cx="3" cy="7" r="1.5" fill="currentColor"/><circle cx="7" cy="7" r="1.5" fill="currentColor"/><circle cx="3" cy="11.5" r="1.5" fill="currentColor"/><circle cx="7" cy="11.5" r="1.5" fill="currentColor"/></svg></span>
      <div class="alloc-task" title="${esc(t.task)}">${esc(t.task)}</div>
      ${t.minutes ? `<span class="alloc-mins">${t.minutes}m</span>` : ''}
    </div>`;
    return `
      <div class="panel-title">Allocate</div>
      <div class="panel-hint">Working from your priority list. Drag to set the order you will work through them.</div>
      <div style="margin-bottom:16px">
        <button class="btn btn-secondary btn-sm" onclick="unskipAlloc()">Switch to day allocation</button>
      </div>
      <div class="card"><div class="card-title" style="background:var(--grey-light);color:var(--red)">Urgent <span style="font-weight:400;opacity:.6">(${urgItems.length})</span></div><div id="allocUrgent">${urgItems.map(mkSkipRow).join('') || '<div style="padding:12px 16px;color:var(--grey-mid);font-style:italic;font-size:13px">No urgent tasks.</div>'}</div></div>
      <div class="card"><div class="card-title" style="background:var(--grey-light);color:var(--orange)">High <span style="font-weight:400;opacity:.6">(${highItems.length})</span></div><div id="allocHigh">${highItems.map(mkSkipRow).join('') || '<div style="padding:12px 16px;color:var(--grey-mid);font-style:italic;font-size:13px">No high priority tasks.</div>'}</div></div>
      <div class="step-nav">
        <button class="btn btn-ghost" onclick="prev()">← Capacity</button>
        <button class="btn btn-primary" onclick="go(8)">Next: Roadmap →</button>
      </div>`;
  }

  return `
    <div class="panel-title">Allocate</div>
    <div class="panel-hint">Assign your tasks to days. The daily bars show how full each day is getting.</div>
    <div style="margin-bottom:16px;text-align:right">
      <button class="btn btn-secondary btn-sm" onclick="skipAlloc()">Skip: work from priority list</button>
    </div>
    ${mkDayCapStrip()}
    <div class="card" style="margin-top:4px">${rows || '<div style="text-align:center;padding:32px;color:var(--grey-mid);font-style:italic">No tasks to allocate.</div>'}</div>
    <div class="step-nav">
      <button class="btn btn-ghost" onclick="prev()">← Capacity</button>
      <button class="btn btn-primary" onclick="applyDayDefaultsAndNext()">Next: Roadmap →</button>
    </div>`;
}

function mkDayCapStrip() {
  const chips = DAYS.map(d => {
    const cap = dayCapacity(d);
    if (cap === 0) return '';
    const used = dayUsed(d);
    const pct = Math.min(100, Math.round(used / cap * 100));
    const over = used > cap;
    const warn = !over && pct >= 80;
    const fillCol = over ? 'var(--red)' : warn ? 'var(--orange)' : 'var(--teal-dark)';
    const textCol = over ? 'var(--red)' : warn ? 'var(--orange)' : 'var(--grey-mid)';
    return `<div class="day-chip">
      <div class="day-chip-name">${d.slice(0,3)}</div>
      <div class="day-chip-bar"><div class="day-chip-fill" style="width:${pct}%;background:${fillCol}"></div></div>
      <div class="day-chip-nums" style="color:${textCol}">${used}/${cap} min${over ? ' ⚠' : ''}</div>
    </div>`;
  }).filter(Boolean).join('');
  if (!chips) return '';
  return `<div style="margin-top:12px">
    <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--grey-mid);margin-bottom:8px">Daily capacity</div>
    <div class="day-strip">${chips}</div>
  </div>`;
}

function setDay(id, d) {
  const t = S.tasks.find(t => t.id === id);
  if (t) { t.dayBlock = d || null; save(); }
  rerender();
}

function applyDayDefaultsAndNext() {
  if (!S.skipAllocation) S.tasks.forEach(t => { if (t.priority === 'Parked' && !t.dayBlock) t.dayBlock = TTR; });
  save(); go(8);
}

// ============================================================
// P8 — Roadmap
// ============================================================
function renderP8() {
  // ---- Priority view (skip allocation mode) ----
  if (S.skipAllocation) {
    const urgent = S.tasks.filter(t => !t.wse && t.priority === 'Urgent');
    const high   = S.tasks.filter(t => !t.wse && t.priority === 'High');
    const parked = S.tasks.filter(t => !t.wse && t.priority === 'Parked');
    const wse    = S.tasks.filter(t => t.wse);

    const mkPriTask = t => `<div class="pri-view-task" data-id="${t.id}">
      <span class="drag-handle" title="Drag to reorder"><svg width="10" height="14" viewBox="0 0 10 14" fill="none"><circle cx="3" cy="2.5" r="1.5" fill="currentColor"/><circle cx="7" cy="2.5" r="1.5" fill="currentColor"/><circle cx="3" cy="7" r="1.5" fill="currentColor"/><circle cx="7" cy="7" r="1.5" fill="currentColor"/><circle cx="3" cy="11.5" r="1.5" fill="currentColor"/><circle cx="7" cy="11.5" r="1.5" fill="currentColor"/></svg></span>
      <div class="pri-view-text">${esc(t.task)}</div>
      ${t.minutes ? `<span style="font-size:12px;color:var(--grey-mid);font-weight:500;flex-shrink:0">${t.minutes}m</span>` : ''}
      <div class="day-task-btns" style="flex-shrink:0">
        <button class="btn-done" onclick="markDone(${t.id})">Done</button>
        <button class="btn-wse" onclick="toggleWse(${t.id})">With someone</button>
      </div>
    </div>`;

    const urgSection = urgent.length ? `<div class="pri-view-section" style="border-top:3px solid var(--red)">
      <div class="pri-view-head"><div class="pri-dot urgent"></div><span class="pri-view-head-label">Urgent</span><span class="pri-view-head-count">${urgent.length} task${urgent.length!==1?'s':''}</span></div>
      <div id="priUrgent">${urgent.map(mkPriTask).join('')}</div>
    </div>` : '';

    const highSection = high.length ? `<div class="pri-view-section" style="border-top:3px solid var(--orange)">
      <div class="pri-view-head"><div class="pri-dot high"></div><span class="pri-view-head-label">High</span><span class="pri-view-head-count">${high.length} task${high.length!==1?'s':''}</span></div>
      <div id="priHigh">${high.map(mkPriTask).join('')}</div>
    </div>` : '';

    const parkedSection = parked.length ? `<details class="pool-section">
      <summary class="pool-head" style="cursor:pointer;user-select:none">
        <span class="pool-head-title">Parked: Not This Week</span>
        <div style="display:flex;align-items:center;gap:8px"><span class="pool-badge" style="background:var(--grey-mid)">${parked.length}</span><span class="pool-chevron">▾</span></div>
      </summary>
      ${parked.map(t => `<div class="pool-task"><span class="pool-task-text">${esc(t.task)}</span>${t.minutes?`<span style="font-size:12px;color:var(--grey-mid)">${t.minutes}m</span>`:''}<button class="btn-done" onclick="markDone(${t.id})">Done</button></div>`).join('')}
    </details>` : '';

    const wseSection = wse.length ? `<div class="pool-section"><div class="pool-head"><span class="pool-head-title">With Someone Else</span><span class="pool-badge" style="background:var(--orange)">${wse.length}</span></div>${wse.map(t=>`<div class="pool-task"><span class="pool-task-text">${esc(t.task)}</span>${t.minutes?`<span style="font-size:12px;color:var(--grey-mid)">${t.minutes}m</span>`:''}<button class="ibtn i-carry" onclick="toggleWse(${t.id})" style="white-space:nowrap">↩ Bring back</button><button class="btn-done" onclick="markDone(${t.id})">Done</button></div>`).join('')}</div>` : '';

    return `
      <div class="panel-title">Roadmap</div>
      <div class="panel-hint">Your priority list for the week. Mark tasks done as you go. Drag to reorder.</div>
      ${urgSection}${highSection}${parkedSection}${wseSection}
      <div class="new-week-bar">
        <div class="new-week-hint" style="font-size:15px;font-weight:600;color:var(--black);margin-bottom:6px">Done for the week?</div>
        <div style="font-size:13px;color:var(--grey-mid);margin-bottom:16px">Save a copy of your plan. Next week, open this app and your unfinished tasks will be waiting in Clarity, ready to reprioritise.</div>
        <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
          <button class="btn btn-primary" onclick="saveAsFile()">Save as file</button>
          <button class="btn btn-secondary" onclick="window.print()">Print</button>
        </div>
      </div>
      <div class="step-nav">
        <button class="btn btn-ghost" onclick="prev()">← Allocate</button>
      </div>`;
  }

  // ---- Day cards ----
  const active = S.tasks.filter(t => !t.wse && t.priority !== 'Parked');

  function taskCard(t) {
    const dot = t.priority === 'Urgent' ? `<div class="pri-dot urgent"></div>` : `<div class="pri-dot high"></div>`;
    return `<div class="day-task" data-id="${t.id}">
      <span class="drag-handle" title="Drag to reorder"><svg width="10" height="14" viewBox="0 0 10 14" fill="none"><circle cx="3" cy="2.5" r="1.5" fill="currentColor"/><circle cx="7" cy="2.5" r="1.5" fill="currentColor"/><circle cx="3" cy="7" r="1.5" fill="currentColor"/><circle cx="7" cy="7" r="1.5" fill="currentColor"/><circle cx="3" cy="11.5" r="1.5" fill="currentColor"/><circle cx="7" cy="11.5" r="1.5" fill="currentColor"/></svg></span>
      ${dot}
      <div class="day-task-text">${esc(t.task)}</div>
      <div class="day-task-right">
        ${t.minutes ? `<span class="day-task-mins">${t.minutes}m</span>` : ''}
        <button class="btn-done" onclick="markDone(${t.id})">Done</button>
        <button class="btn-wse" onclick="toggleWse(${t.id})">With someone</button>
      </div>
    </div>`;
  }

  const isWeekend = d => d === 'Saturday' || d === 'Sunday';
  const dayLabel = d => d === TTR ? 'Unallocated' : d;

  const cards = ALL_DAYS.map(day => {
    const isTTR = day === TTR;
    const dt = isTTR
      ? active.filter(t => t.dayBlock === TTR || (!t.dayBlock && (t.priority === 'Urgent' || t.priority === 'High')))
      : active.filter(t => t.dayBlock === day);

    if (dt.length === 0 && isTTR) return '';
    if (dt.length === 0 && isWeekend(day) && dayCapacity(day) === 0) return '';

    const used = isTTR ? 0 : dayUsed(day);
    const dayCap = isTTR ? 0 : dayCapacity(day);
    const pct = dayCap > 0 ? Math.min(100, Math.round(used / dayCap * 100)) : 0;
    const over = dayCap > 0 && used > dayCap;

    const col = isTTR ? 'var(--grey-mid)' : dayColor(day);
    return `<div class="day-card" style="border-top:3px solid ${col}">
      <div class="day-card-head">
        <div>
          <div class="day-card-name" style="color:${col}">${dayLabel(day)}</div>
          ${dayCap > 0 ? `<div class="day-card-cap">${used}/${dayCap} min${over ? ' ⚠' : ''}</div>` : ''}
        </div>
      </div>
      ${dayCap > 0 ? `<div class="cap-bar"><div class="cap-fill ${over?'over':pct>=80?'warn':''}" style="width:${pct}%"></div></div>` : ''}
      <div id="dayTasks-${day.replace(/ /g,'_')}">${dt.length === 0 ? `<div class="day-empty">Nothing allocated</div>` : dt.map(taskCard).join('')}</div>
    </div>`;
  }).filter(Boolean).join('');

  // ---- Parked pool ----
  const parked = S.tasks.filter(t => !t.wse && t.priority === 'Parked');
  const parkedHtml = parked.length ? `
    <details class="pool-section">
      <summary class="pool-head" style="cursor:pointer;user-select:none">
        <span class="pool-head-title">Parked: Not This Week</span>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="pool-badge" style="background:var(--grey-mid)">${parked.length}</span>
          <span class="pool-chevron">▾</span>
        </div>
      </summary>
      ${parked.map(t => `<div class="pool-task">
        <span class="pool-task-text">${esc(t.task)}</span>
        ${t.minutes ? `<span style="font-size:12px;color:var(--grey-mid)">${t.minutes}m</span>` : ''}
        <button class="btn-done" onclick="markDone(${t.id})">Done</button>
      </div>`).join('')}
    </details>` : '';

  // ---- WSE pool ----
  const wse = S.tasks.filter(t => t.wse);
  const wseHtml = wse.length ? `
    <div class="pool-section">
      <div class="pool-head">
        <span class="pool-head-title">With Someone Else</span>
        <span class="pool-badge" style="background:var(--orange)">${wse.length}</span>
      </div>
      ${wse.map(t => `<div class="pool-task">
        <span class="pool-task-text">${esc(t.task)}</span>
        ${t.minutes ? `<span style="font-size:12px;color:var(--grey-mid)">${t.minutes}m</span>` : ''}
        <button class="ibtn i-carry" onclick="toggleWse(${t.id})" style="white-space:nowrap">↩ Bring back</button>
        <button class="btn-done" onclick="markDone(${t.id})">Done</button>
      </div>`).join('')}
    </div>` : '';

  return `
    <div class="panel-title">Roadmap</div>
    <div class="panel-hint">Your week at a glance. Mark tasks done as you go.</div>
    ${cards ? `<div class="day-cards">${cards}</div>` : `<div style="text-align:center;padding:40px;color:var(--grey-mid);font-size:14px;font-style:italic">No tasks allocated. Go back to Allocate to assign tasks to days.</div>`}
    ${parkedHtml}${wseHtml}
    <div class="new-week-bar">
      <div class="new-week-hint" style="font-size:15px;font-weight:600;color:var(--black);margin-bottom:6px">Done for the week?</div>
      <div style="font-size:13px;color:var(--grey-mid);margin-bottom:16px">Save a copy of your plan. Next week, open this app and your unfinished tasks will be waiting in Clarity, ready to reprioritise.</div>
      <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
        <button class="btn btn-primary" onclick="saveAsFile()">Save as file</button>
        <button class="btn btn-secondary" onclick="window.print()">Print</button>
      </div>
    </div>
    <div class="step-nav">
      <button class="btn btn-ghost" onclick="prev()">← Allocate</button>
    </div>
    <div style="text-align:center;padding:24px 0 8px">
      <button onclick="confirmReset()" style="background:none;border:none;font-size:12px;color:var(--grey-mid);cursor:pointer;text-decoration:underline;padding:4px 8px" onmouseover="this.style.color='var(--red)'" onmouseout="this.style.color='var(--grey-mid)'">Start over (clear all data)</button>
    </div>`;
}

function getRoadmapObs(ratio, cap, committed, taskCount) {
  if (cap === 0) return "Enter your meeting-free time above to see your commitment vs capacity.";
  if (committed === 0) return "No time estimates on your urgent or high tasks. Add estimates in the Estimate step to see your reality.";
  const n = taskCount || 0;
  const carryEst = ratio > 1 && n > 0 ? Math.round(n * (1 - 1 / ratio)) : 0;
  const carryStr = carryEst > 0 ? ` At this ratio, roughly <strong>${carryEst} task${carryEst !== 1 ? 's' : ''}</strong> will likely carry over.` : '';
  if (ratio < 0.6) return `Your committed work is ${Math.round(ratio*100)}% of your available capacity. Either you have room to take on more, or some tasks are still missing estimates.`;
  if (ratio < 0.9) return "Your committed work is within capacity. Good position to execute from. You have a buffer for the unexpected.";
  if (ratio < 1.1) return "Your committed work is close to your available capacity. Manageable if nothing unexpected lands this week.";
  if (ratio < 1.5) return `Your plan is ${ratio.toFixed(1)}x your available capacity.${carryStr} Consider moving lower-priority items to Parked now rather than letting the week decide.`;
  if (ratio < 2.0) return `Your plan is ${ratio.toFixed(1)}x your available capacity.${carryStr} Significant carry-over is likely. Be deliberate about what actually gets done first.`;
  return `Your plan is ${ratio.toFixed(1)}x your available capacity.${carryStr} This week's list needs fundamental reallocation before it's executable.`;
}

function setMf(day, v) { S.mf[day] = parseInt(v) || 0; save(); rerender(); }
function setHours(day, v) { S.mf[day] = Math.round((parseFloat(v) || 0) * 60); save(); rerender(); }

function markDone(id) { S.tasks = S.tasks.filter(t => t.id !== id); S.completedThisWeek++; save(); render(); }

function toggleWse(id) {
  const t = S.tasks.find(t => t.id === id);
  if (t) { t.wse = !t.wse; if (t.wse) { t.priority = null; t.dayBlock = null; } }
  save(); render();
}


// ============================================================
// New week
// ============================================================
function startNewWeek() {
  if (!confirm('Close this week and start the next?\n\nUnfinished tasks will carry forward for reprioritisation.')) return;

  const carry = S.tasks.filter(t => !t.wse);
  S.history.push({
    weekEnded: new Date().toISOString().split('T')[0],
    totalTasks: carry.length + S.completedThisWeek,
    completedTasks: S.completedThisWeek,
    carryOverTasks: carry.length,
    carryOverMins: carry.reduce((s,t) => s + (t.minutes||0), 0),
    urgentRemaining: S.tasks.filter(t => t.priority === 'Urgent').length,
    planned: committedMins(),
    capacity: totalCapacity()
  });

  S.tasks = S.tasks.map(t => ({
    ...t, priority: null, dayBlock: null, carriedOver: true
  }));

  S.completedThisWeek = 0;
  S.step = 1;
  S.mf = { Monday:0, Tuesday:0, Wednesday:0, Thursday:0, Friday:0, Saturday:0, Sunday:0 };
  editingId = null; notesOpen = new Set();

  save(); render();
}

// ============================================================
// Reset
// ============================================================
function confirmReset() {
  if (!confirm('Start completely over? All tasks and history will be deleted.')) return;
  localStorage.removeItem(KEY);
  S = { step:1, tasks:[], nextId:1, mf:{Monday:0,Tuesday:0,Wednesday:0,Thursday:0,Friday:0,Saturday:0,Sunday:0}, completedThisWeek:0, history:[], lastSnapshotDate:null, skipAllocation:false };
  editingId = null; notesOpen = new Set(); sortDir = 'asc';
  render();
}

// ---- Init ----
initState();
render();
</script>
</body>
