<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#007a78">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CLEAR OS">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>CLEAR OS: Weekly Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
<style>
:root {
  --purple: #652d90;
  --teal: #009a98;
  --teal-dark: #007a78;
  --yellow: #edc530;
  --orange: #f6931e;
  --red: #eb1c24;
  --black: #111111;
  --grey-dark: #404040;
  --grey-mid: #6b6b6b;
  --grey-light: #f5f5f5;
  --grey-border: #e8e8e8;
  --white: #ffffff;
  --font-display: 'Outfit', sans-serif;
  --font-body: 'DM Sans', sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-font-smoothing: antialiased; }
body { font-family: var(--font-body); background: var(--grey-light); color: var(--grey-dark); min-height: 100vh; }

/* ---- Header ---- */
header { background: var(--white); position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 20px rgba(0,0,0,0.07); border-bottom: 1px solid var(--grey-border); }
.header-rainbow { height: 3px; background: linear-gradient(90deg, var(--purple), var(--teal), var(--yellow), var(--orange), var(--red)); }
.header-inner { padding: 14px 28px 12px; }
.header-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }

.logo { font-family: var(--font-display); font-size: 22px; font-weight: 800; color: var(--black); letter-spacing: 0.5px; line-height: 1; }
.logo-sub { font-family: var(--font-body); font-size: 10px; font-weight: 500; color: var(--teal-dark); letter-spacing: 0.08em; text-transform: uppercase; margin-top: 3px; }

.header-btns { display: flex; gap: 6px; align-items: center; }
.btn-hdr { font-family: var(--font-body); font-size: 12px; color: var(--grey-mid); background: none; border: 1px solid var(--grey-border); border-radius: 6px; padding: 6px 12px; cursor: pointer; transition: color .15s, border-color .15s; }
.btn-hdr:hover { color: var(--grey-dark); border-color: var(--grey-mid); }
.btn-hdr-primary { background: var(--black); color: var(--white) !important; border-color: var(--black) !important; }
.btn-hdr-primary:hover { background: var(--teal-dark) !important; border-color: var(--teal-dark) !important; }
.btn-hdr-reset:hover { color: var(--red) !important; border-color: var(--red) !important; }

/* ---- Step nav ---- */
.steps { display: flex; align-items: center; overflow-x: auto; padding-bottom: 2px; }
.step-btn { display: flex; align-items: center; gap: 7px; padding: 6px 10px; border: none; background: none; cursor: pointer; font-family: var(--font-body); font-size: 12px; font-weight: 500; color: var(--grey-mid); border-radius: 6px; transition: background .15s, color .15s; white-space: nowrap; }
.step-btn:hover { background: var(--grey-light); color: var(--grey-dark); }
.step-btn.active { color: var(--black); background: var(--grey-light); }
.step-btn.done { color: var(--teal-dark); }
.step-num { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; border: 1.5px solid var(--grey-border); flex-shrink: 0; }
.step-btn.active .step-num { background: var(--black); color: var(--white); border-color: var(--black); }
.step-btn.done .step-num { background: var(--teal-dark); color: var(--white); border-color: var(--teal-dark); }
.step-divider { width: 16px; height: 1px; background: var(--grey-border); flex-shrink: 0; }

/* ---- Main layout ---- */
main { max-width: 1400px; margin: 0 auto; padding: 32px 40px 80px; }
.panel-title { font-family: var(--font-display); font-size: 26px; font-weight: 700; color: var(--black); margin-bottom: 4px; }
.panel-hint { font-size: 14px; color: var(--grey-mid); margin-bottom: 28px; }

/* ---- Cards / sections ---- */
.card { background: var(--white); border: 1px solid var(--grey-border); border-radius: 10px; margin-bottom: 16px; overflow: hidden; }
.card-title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--grey-dark); padding: 12px 16px; border-bottom: 1px solid var(--grey-border); }

/* ---- Health warnings ---- */
.warn-banner { display: flex; gap: 14px; padding: 16px 18px; border-radius: 10px; margin-bottom: 16px; }
.warn-urgent { background: #fff0f0; border: 1px solid var(--red); }
.warn-high { background: #fff8f0; border: 1px solid var(--orange); }
.warn-icon { font-size: 22px; flex-shrink: 0; line-height: 1.3; }
.warn-title { font-family: var(--font-display); font-weight: 700; font-size: 14px; margin-bottom: 4px; color: var(--black); }
.warn-text { font-size: 13px; color: var(--grey-dark); line-height: 1.5; }

/* ---- Clarity rows ---- */
.clarity-row { display: flex; align-items: flex-start; gap: 10px; padding: 11px 16px; border-bottom: 1px solid var(--grey-border); }
.clarity-row:last-child { border-bottom: none; }
.clarity-row-body { flex: 1; }
.clarity-row-name { font-size: 14px; color: var(--black); line-height: 1.4; margin-bottom: 4px; }
.clarity-row-meta { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.clarity-actions { display: flex; gap: 6px; flex-shrink: 0; align-items: flex-start; }
.ibtn { font-family: var(--font-body); font-size: 12px; font-weight: 500; padding: 5px 10px; border-radius: 6px; border: none; cursor: pointer; transition: background .12s; }
.i-done { background: #f0fff4; color: #1a7a40; border: 1px solid #b8e8c8; }
.i-done:hover { background: #dcfaea; }
.i-carry { background: var(--grey-light); color: var(--grey-dark); border: 1px solid var(--grey-border); }
.i-carry:hover { background: var(--grey-border); }
.i-todo { background: #f0f8ff; color: var(--teal-dark); border: 1px solid #b8dff0; }
.i-todo:hover { background: #daf0ff; }

/* ---- Badges ---- */
.badge { display: inline-flex; align-items: center; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 10px; text-transform: uppercase; letter-spacing: 0.04em; }
.badge-urgent { background: #fff0f0; color: var(--red); border: 1px solid #ffc8c8; }
.badge-high { background: #fff8f0; color: var(--orange); border: 1px solid #fdd8a8; }
.badge-parked { background: var(--grey-light); color: var(--grey-mid); border: 1px solid var(--grey-border); }
.badge-day { background: #f0f8ff; color: var(--teal-dark); border: 1px solid #b8dff0; }
.badge-mins { background: var(--grey-light); color: var(--grey-mid); border: 1px solid var(--grey-border); }

/* ---- Fresh state ---- */
.fresh-state { text-align: center; padding: 44px 20px; color: var(--grey-mid); }
.fresh-icon { font-size: 32px; margin-bottom: 12px; }
.fresh-state h3 { font-family: var(--font-display); font-size: 18px; color: var(--black); margin-bottom: 8px; }
.fresh-state p { font-size: 14px; }

/* ---- Task list (List step) ---- */
.add-row { display: flex; gap: 8px; padding: 12px 16px; background: var(--grey-light); border-bottom: 1px solid var(--grey-border); }
.add-input { flex: 1; border: 1px solid var(--grey-border); border-radius: 7px; padding: 8px 12px; font-family: var(--font-body); font-size: 14px; outline: none; background: var(--white); }
.add-input:focus { border-color: var(--teal-dark); }
.task-row { display: flex; align-items: flex-start; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--grey-border); }
.task-row:last-child { border-bottom: none; }
.task-text { flex: 1; font-size: 14px; color: var(--black); line-height: 1.4; }
.task-actions { display: flex; gap: 5px; flex-shrink: 0; align-items: flex-start; }
.edit-input { flex: 1; border: 1px solid var(--teal-dark); border-radius: 6px; padding: 6px 10px; font-family: var(--font-body); font-size: 14px; outline: none; }
.notes-area { width: 100%; border: 1px solid var(--grey-border); border-radius: 6px; padding: 8px 10px; font-family: var(--font-body); font-size: 13px; resize: vertical; outline: none; min-height: 56px; margin-top: 4px; }
.notes-area:focus { border-color: var(--teal-dark); }
.totals-row { display: flex; gap: 16px; align-items: center; padding: 9px 16px; background: var(--grey-light); border-top: 1px solid var(--grey-border); font-size: 13px; color: var(--grey-mid); }
.totals-row strong { color: var(--black); }

/* ---- Estimate ---- */
.est-row { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--grey-border); }
.est-row:last-child { border-bottom: none; }
.est-task { flex: 1; font-size: 14px; color: var(--black); }
.est-input { width: 80px; border: 1px solid var(--grey-border); border-radius: 6px; padding: 7px 10px; font-family: var(--font-body); font-size: 14px; text-align: center; outline: none; }
.est-input:focus { border-color: var(--teal-dark); }
.est-unit { font-size: 13px; color: var(--grey-mid); width: 26px; }

/* ---- Priority rows (Urgent/High blocks) ---- */
.pri-row { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--grey-border); transition: background .12s; }
.pri-row:last-child { border-bottom: none; }
.pri-row.is-urgent { background: #fff8f8; }
.pri-row.is-high { background: #fffaf5; }
.pri-row-text { flex: 1; font-size: 14px; color: var(--black); line-height: 1.35; }
.pri-row-mins { font-size: 12px; color: var(--grey-mid); flex-shrink: 0; }

/* ---- Buttons ---- */
.btn { font-family: var(--font-body); font-size: 13px; font-weight: 500; padding: 7px 16px; border-radius: 7px; border: none; cursor: pointer; transition: background .15s, transform .1s; }
.btn:hover { transform: translateY(-1px); }
.btn-primary { background: var(--black); color: var(--white); }
.btn-primary:hover { background: var(--teal-dark); }
.btn-secondary { background: var(--grey-light); color: var(--grey-dark); border: 1px solid var(--grey-border); }
.btn-secondary:hover { background: var(--grey-border); }
.btn-ghost { background: none; color: var(--grey-mid); border: 1px solid transparent; }
.btn-ghost:hover { color: var(--grey-dark); border-color: var(--grey-border); transform: none; }
.btn-outline { background: transparent; color: var(--black); border: 1.5px solid var(--black); }
.btn-outline:hover { background: var(--black); color: var(--white); }
.btn-sm { font-size: 12px; padding: 5px 10px; }
.btn-danger { background: #fff0f0; color: var(--red); border: 1px solid #ffd0d0; }
.btn-danger:hover { background: #ffe0e0; }

/* Urgent / High toggle buttons */
.btn-mark-urgent { background: var(--grey-light); color: var(--grey-dark); border: 1px solid var(--grey-border); font-size: 12px; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-family: var(--font-body); transition: all .12s; }
.btn-mark-urgent:hover { border-color: var(--red); color: var(--red); }
.btn-mark-urgent.on { background: var(--red); color: var(--white); border-color: var(--red); }
.btn-mark-high { background: var(--grey-light); color: var(--grey-dark); border: 1px solid var(--grey-border); font-size: 12px; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-family: var(--font-body); transition: all .12s; }
.btn-mark-high:hover { border-color: var(--orange); color: var(--orange); }
.btn-mark-high.on { background: var(--orange); color: var(--white); border-color: var(--orange); }

/* ---- Allocate ---- */
.alloc-row { display: flex; align-items: center; gap: 10px; padding: 9px 16px; border-bottom: 1px solid var(--grey-border); }
.alloc-row:last-child { border-bottom: none; }
.alloc-task { flex: 1; font-size: 14px; color: var(--black); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.alloc-mins { font-size: 12px; color: var(--grey-mid); flex-shrink: 0; }
.day-select { border: 1px solid var(--grey-border); border-radius: 6px; padding: 5px 7px; font-family: var(--font-body); font-size: 12px; color: var(--grey-dark); outline: none; background: var(--white); flex-shrink: 0; }
.day-select:focus { border-color: var(--teal-dark); }

/* ---- Roadmap capacity ---- */
.mf-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
.mf-cell { display: flex; flex-direction: column; align-items: stretch; gap: 4px; }
.mf-day-lbl { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--grey-mid); text-align: center; }
.mf-input { width: 100%; border: 1px solid var(--grey-border); border-radius: 7px; padding: 9px 4px; font-family: var(--font-body); font-size: 14px; text-align: center; outline: none; }
.mf-input:focus { border-color: var(--teal-dark); }

/* Reality delta */
.reality-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 16px 0; }
.reality-card { background: var(--white); border: 1px solid var(--grey-border); border-radius: 10px; padding: 14px 16px; }
.reality-lbl { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--grey-mid); margin-bottom: 5px; }
.reality-val { font-family: var(--font-display); font-size: 28px; font-weight: 700; color: var(--black); line-height: 1; }
.reality-val.ok { color: var(--teal-dark); }
.reality-val.warn { color: var(--orange); }
.reality-val.over { color: var(--red); }
.reality-sub { font-size: 11px; color: var(--grey-mid); margin-top: 3px; }
.obs-box { border-radius: 10px; padding: 13px 16px; font-size: 14px; color: var(--grey-dark); line-height: 1.55; border: 1px solid var(--grey-border); border-left: 3px solid var(--teal-dark); background: var(--white); margin-bottom: 20px; }
.obs-box.warn { border-left-color: var(--orange); }
.obs-box.over { border-left-color: var(--red); }
.urgency-friction { padding: 12px 16px; font-size: 13px; line-height: 1.55; color: var(--grey-dark); background: #fff0f0; border-top: 1px solid #ffd0d0; border-bottom-left-radius: 10px; border-bottom-right-radius: 10px; }
.cap-placeholder { padding: 24px 18px; border-radius: 10px; font-size: 14px; color: var(--grey-mid); border: 1.5px dashed var(--grey-border); text-align: center; margin-bottom: 20px; font-style: italic; }
.cap-decision { padding: 15px 18px; border-radius: 10px; font-size: 14px; line-height: 1.55; margin-bottom: 20px; }
.cap-good { background: #f0fff4; border: 1px solid #b8e8c8; color: #1a7a40; }
.cap-warn { background: #fff8f0; border: 1px solid #fdd8a8; color: #b45309; }
.cap-over { background: #fff0f0; border: 1px solid #ffc8c8; color: var(--red); }
.cap-neutral { background: var(--grey-light); border: 1px solid var(--grey-border); color: var(--grey-mid); }
.step-indicator { display: none; font-size: 12px; font-weight: 600; color: var(--grey-mid); padding: 0 0 6px; letter-spacing: 0.02em; }
.adv-select { font-family: var(--font-body); font-size: 13px; padding: 7px 10px; border: 1px solid var(--grey-border); border-radius: 6px; background: var(--white); color: var(--grey-dark); cursor: pointer; height: 38px; }
.adv-mins-input { font-family: var(--font-body); font-size: 13px; padding: 7px 8px; border: 1px solid var(--grey-border); border-radius: 6px; width: 80px; height: 38px; text-align: center; color: var(--grey-dark); }
.adv-mins-input:focus, .adv-select:focus { outline: none; border-color: var(--teal-dark); }
.row-adv-select { font-family: var(--font-body); font-size: 12px; padding: 4px 6px; border: 1px solid var(--grey-border); border-radius: 6px; background: var(--white); color: var(--grey-dark); cursor: pointer; height: 30px; flex-shrink: 0; }
.row-adv-mins { font-family: var(--font-body); font-size: 12px; padding: 4px 6px; border: 1px solid var(--grey-border); border-radius: 6px; width: 64px; height: 30px; text-align: center; color: var(--grey-dark); flex-shrink: 0; }
.row-adv-select:focus, .row-adv-mins:focus { outline: none; border-color: var(--teal-dark); }
.task-badges { display: inline-flex; gap: 4px; margin-left: 8px; flex-wrap: wrap; align-items: center; }
.delta-callout { border-radius: 8px; padding: 11px 14px; font-size: 13px; color: var(--grey-dark); line-height: 1.5; border: 1px solid #fdd8a8; background: #fff8f0; margin-bottom: 12px; }
.delta-callout strong { color: var(--orange); }

/* ---- Drag handles ---- */
.drag-handle { cursor: grab; color: var(--grey-border); padding: 0 6px 0 2px; flex-shrink: 0; display: flex; align-items: center; transition: color .12s; }
.drag-handle:hover { color: var(--grey-mid); }
.drag-handle:active { cursor: grabbing; }
.drag-ghost { opacity: 0.35; background: var(--grey-light) !important; border-radius: 8px; }

/* ---- Priority view (skip allocation mode) ---- */
.pri-view-section { background: var(--white); border: 1px solid var(--grey-border); border-radius: 12px; overflow: hidden; margin-bottom: 16px; box-shadow: 0 2px 16px rgba(0,0,0,0.06); }
.pri-view-head { padding: 14px 18px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--grey-border); background: var(--grey-light); }
.pri-view-head-label { font-family: var(--font-display); font-size: 18px; font-weight: 800; color: var(--black); }
.pri-view-head-count { font-size: 12px; color: var(--grey-mid); margin-left: auto; }
.pri-view-task { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-bottom: 1px solid var(--grey-border); }
.pri-view-task:last-child { border-bottom: none; }
.pri-view-text { flex: 1; font-size: 14px; color: var(--black); line-height: 1.4; word-break: break-word; min-width: 0; }

/* ---- Day capacity strip (Allocate) ---- */
.day-strip { display: flex; flex-wrap: wrap; gap: 8px; }
.day-chip { background: var(--white); border: 1px solid var(--grey-border); border-radius: 8px; padding: 8px 12px; min-width: 100px; flex: 1; }
.day-chip-name { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--grey-dark); margin-bottom: 6px; }
.day-chip-bar { height: 4px; background: var(--grey-border); border-radius: 2px; margin-bottom: 5px; overflow: hidden; }
.day-chip-fill { height: 4px; border-radius: 2px; transition: width .2s; }
.day-chip-nums { font-size: 11px; color: var(--grey-mid); }

/* ---- Day cards (Roadmap) ---- */
.day-cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
.day-card { background: var(--white); border: 1px solid var(--grey-border); border-radius: 12px; overflow: hidden; box-shadow: 0 2px 16px rgba(0,0,0,0.06); transition: box-shadow .15s; }
.day-card:hover { box-shadow: 0 4px 24px rgba(0,0,0,0.1); }
.day-card-head { padding: 16px 18px 12px; background: var(--white); border-bottom: 1px solid var(--grey-border); display: flex; justify-content: space-between; align-items: flex-start; }
.day-card-name { font-family: var(--font-display); font-size: 20px; font-weight: 800; color: var(--black); letter-spacing: -0.3px; }
.day-card-cap { font-size: 12px; color: var(--grey-mid); margin-top: 2px; }
.cap-bar { height: 4px; background: var(--grey-border); }
.cap-fill { height: 4px; background: var(--teal-dark); transition: width .3s; }
.cap-fill.over { background: var(--red); }
.cap-fill.warn { background: var(--orange); }
.day-task { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-bottom: 1px solid var(--grey-border); }
.day-task:last-child { border-bottom: none; }
.pri-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.pri-dot.urgent { background: var(--red); }
.pri-dot.high { background: var(--orange); }
.day-task-text { flex: 1; font-size: 14px; color: var(--black); line-height: 1.4; word-break: break-word; min-width: 0; }
.day-task-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.day-task-mins { font-size: 12px; color: var(--grey-mid); font-weight: 500; }
.day-task-btns { display: flex; gap: 4px; }
.btn-done { background: #f0fff4; color: #1a7a40; border: 1px solid #b8e8c8; font-size: 12px; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-family: var(--font-body); font-weight: 500; }
.btn-done:hover { background: #dcfaea; }
.btn-wse { background: #fff8f0; color: var(--orange); border: 1px solid #fde0b8; font-size: 12px; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-family: var(--font-body); white-space: nowrap; font-weight: 500; }
.btn-wse:hover { background: #feeedd; }
.day-empty { padding: 18px; font-size: 13px; color: var(--grey-mid); font-style: italic; }

/* ---- Pool sections (TTR / Parked / WSE) ---- */
.pool-section { background: var(--white); border: 1px solid var(--grey-border); border-radius: 10px; overflow: hidden; margin-top: 12px; }
.pool-head { padding: 10px 14px; background: var(--grey-light); border-bottom: 1px solid var(--grey-border); display: flex; align-items: center; justify-content: space-between; }
details.pool-section > summary { list-style: none; }
details.pool-section > summary::-webkit-details-marker { display: none; }
details.pool-section:not([open]) > summary { border-bottom: none; }
.pool-chevron { font-size: 13px; color: var(--grey-mid); transition: transform .2s; }
details.pool-section[open] .pool-chevron { transform: rotate(180deg); }
.pool-head-title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--grey-dark); }
.pool-badge { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 10px; color: var(--white); }
.pool-task { display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-bottom: 1px solid var(--grey-border); font-size: 13px; }
.pool-task:last-child { border-bottom: none; }
.pool-task-text { flex: 1; color: var(--black); }

/* ---- Review ---- */



/* Allocate parked collapsed group */
.alloc-parked { border-top: 1px solid var(--grey-border); }
.alloc-parked-summary { list-style: none; cursor: pointer; user-select: none; padding: 10px 16px; background: var(--grey-light); display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--grey-dark); }
.alloc-parked-summary::-webkit-details-marker { display: none; }
.alloc-parked[open] .pool-chevron { transform: rotate(180deg); }

/* ---- Nav footer ---- */
.step-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--grey-border); }
.new-week-bar { text-align: center; margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--grey-border); }
.new-week-hint { font-size: 13px; color: var(--grey-mid); margin-bottom: 12px; }

/* ---- Print ---- */
@media print {
  header { position: static; box-shadow: none; }
  .header-btns, .steps, .step-nav, .new-week-bar { display: none !important; }
  body { background: white; }
  main { padding: 20px; max-width: 100%; }
  .card, .day-card, .pool-section { box-shadow: none; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .day-cards { grid-template-columns: repeat(4, 1fr); }
}

@media (max-width: 640px) {
  .day-cards { grid-template-columns: 1fr; }
}

@media (max-width: 900px) {
  main { padding: 24px 20px 60px; }
}

@media (max-width: 640px) {
  .step-indicator { display: block; }
  .steps { -webkit-overflow-scrolling: touch; }
  .step-btn { padding: 5px 8px; font-size: 11px; gap: 5px; }
  .step-divider { width: 10px; }
  .reality-strip { grid-template-columns: 1fr 1fr; }
  .mf-grid { grid-template-columns: repeat(4, 1fr); }
  .header-inner { padding: 12px 16px 10px; }
  main { padding: 16px 14px 60px; }
  .day-cards { grid-template-columns: 1fr; }
  .panel-title { font-size: 22px; }
  .ibtn, .btn { min-height: 40px; }
  .btn-sm { min-height: 36px; }
  .add-row-adv { flex-wrap: wrap; gap: 6px; }
  .add-row-adv .add-input { flex: 1 1 100%; }
  .add-row-adv .adv-select { flex: 1 1 auto; }
  .add-row-adv .adv-mins-input { width: 70px; }
  .alloc-row { flex-wrap: wrap; gap: 6px; }
  .day-select { width: 100%; }
  .reality-card { padding: 12px 14px; }
  .mf-input { font-size: 16px; }
}
</style>
</head>
<body>

<header>
  <div class="header-rainbow"></div>
  <div class="header-inner">
    <div class="header-row">
      <div>
        <div class="logo">CLEAR OS</div>
        <div class="logo-sub">Weekly Plan</div>
      </div>
      <div></div>
    </div>
    <div class="step-indicator" id="step-indicator"></div>
    <div class="steps" id="steps"></div>
  </div>
</header>

<main id="main"></main>
